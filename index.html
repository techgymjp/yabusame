<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>流鏑馬 — YABUSAME</title>
<meta name="description" content="疾走する馬上から三つの的を射抜く、流鏑馬の3Dシミュレーションゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top">
    <div class="targets" id="hud-targets"></div>
    <div class="stat"><span class="label">矢</span><span id="hud-arrows"></span></div>
    <div class="stat"><span class="label">速</span><span id="hud-speed">0</span><small>km/h</small></div>
    <div class="stat"><span class="label">時</span><span id="hud-time">0.00</span><small>秒</small></div>
    <div class="stat"><span class="label">風</span><span id="hud-wind"></span></div>
  </div>
  <div id="progress"><div id="progress-track"></div><div id="progress-horse">🐎</div></div>
  <div id="reticle"></div>
  <div id="impact"></div>
  <div id="draw-gauge"><div id="draw-fill"></div></div>
  <div id="message"></div>
  <div id="hint"></div>
</div>

<div id="title" class="screen">
  <div class="panel">
    <h1>流鏑馬</h1>
    <p class="sub">YABUSAME — 騎射の神事</p>
    <p class="intro">疾走する馬の上で立ち上がり、弓手（左）に並ぶ三つの的を鏑矢で射抜け。<br>馬場二町（約218m）を駆け抜ける十数秒の勝負。</p>
    <div class="row">
      <span class="label">難易度</span>
      <div class="seg" id="difficulty">
        <button data-v="easy">初級</button>
        <button data-v="normal" class="on">中級</button>
        <button data-v="hard">本式</button>
      </div>
    </div>
    <p class="diffnote" id="diffnote"></p>
    <div class="row">
      <span class="label">画質</span>
      <div class="seg" id="quality">
        <button data-v="high">高</button>
        <button data-v="medium">中</button>
        <button data-v="low">低</button>
      </div>
    </div>
    <div class="row">
      <span class="label">感度</span>
      <input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1">
    </div>
    <button id="start" class="big">馬場入り</button>
    <div class="controls">
      <div><kbd>マウス</kbd> 狙う</div>
      <div><kbd>左ボタン 長押し</kbd> 弓を引く ／ 離して放つ</div>
      <div><kbd>W</kbd><kbd>S</kbd> 馬を追う・抑える</div>
      <div><kbd>C</kbd> 視点切替 &nbsp; <kbd>Esc</kbd> 一時停止</div>
    </div>
    <p class="best" id="best"></p>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel small">
    <h2>一時停止</h2>
    <button id="resume" class="big">再開</button>
    <button id="quit" class="ghost">タイトルへ</button>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="panel">
    <h2 id="result-title">結果</h2>
    <div id="result-rows"></div>
    <div id="result-score"></div>
    <p class="best" id="result-best"></p>
    <button id="again" class="big">もう一度</button>
    <button id="toTitle" class="ghost">タイトルへ</button>
  </div>
</div>

<div id="touch" class="hidden">
  <button id="touch-draw">引く</button>
  <button id="touch-cam">視点</button>
</div>

<div id="loading">支度中…</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
